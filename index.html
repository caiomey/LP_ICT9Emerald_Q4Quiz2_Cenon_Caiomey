<br> 


<button onclick ="checkGrade()" class="btn btn-success">Submit</button>

<script>
  function checkGrade() {
    const grade = parseFloat(document.getElementById('gradeInput').value);

    if (isNaN(grade)) {
      alert("Please enter a valid number.");
    } else if (grade >= 94 && grade <= 100) {
      alert("Excellent");
    } else if (grade >= 87 && grade <= 93.99) {
      alert("Above Satisfactory");
    } else if (grade >= 80 && grade <= 86.99) {
      alert("Satisfactory");
    } else if (grade >= 75 && grade <= 79.99) {
      alert("Needs Improvement");
    } else if (grade >= 70 && grade <= 74.99) {
      alert("Poor");
    } else {
      alert("Grade out of range.");
    }
  }
</script>
